name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    # The CMake presets intentionally target Visual Studio 2022.
    runs-on: windows-2022

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Check that the tag matches the version in CMakeLists.txt
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          $match = Select-String -Path CMakeLists.txt -Pattern 'set\(TPMATE_VERSION_DEFAULT "([^"]+)"\)'
          if (-not $match) { throw "TPMATE_VERSION_DEFAULT was not found in CMakeLists.txt." }
          $source = $match.Matches[0].Groups[1].Value
          if ($source -ne $version) {
            throw "Tag ${{ github.ref_name }} does not match TPMATE_VERSION_DEFAULT $source. Update CMakeLists.txt before tagging."
          }
          Write-Host "Tag and CMakeLists.txt agree on version $version."

      # The test programs are excluded from the default build, so name every target.
      - name: Build x64
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          Write-Host "Building TPMate version $version (x64)"
          cmake --preset x64 "-DTPMATE_VERSION:STRING=$version"
          cmake --build --preset release-x64 --target TPMate TPMateDriverStatusTests TPMateDownloaderTests TPMatePaintStoreTests TPMateTradingPaintsTests TPMatePresenceTests TPMateReloadTests TPMateUpdateTests

      - name: Build x86
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          Write-Host "Building TPMate version $version (x86)"
          cmake --preset x86 "-DTPMATE_VERSION:STRING=$version"
          cmake --build --preset release-x86 --target TPMate TPMateDriverStatusTests TPMateDownloaderTests TPMatePaintStoreTests TPMateTradingPaintsTests TPMatePresenceTests TPMateReloadTests TPMateUpdateTests

      # Nothing is published unless the tests pass for both builds.
      - name: Run tests
        shell: pwsh
        run: |
          foreach ($arch in 'x64', 'x86') {
            foreach ($test in 'DriverStatus', 'Downloader', 'PaintStore', 'TradingPaints', 'Presence', 'Reload', 'Update') {
              & ".\build\$arch\Release\TPMate${test}Tests.exe"
              if ($LASTEXITCODE -ne 0) { throw "TPMate${test}Tests ($arch) failed with exit code $LASTEXITCODE." }
            }
          }

      - name: Package release assets
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $assets = @()
          foreach ($arch in 'x64', 'x86') {
            $packageDir = Join-Path $env:RUNNER_TEMP "tpmate-release\TPMate-$arch"
            $exePath = Join-Path $env:GITHUB_WORKSPACE "TPMate-$tag-windows-$arch.exe"
            $zipPath = Join-Path $env:GITHUB_WORKSPACE "TPMate-$tag-windows-$arch.zip"
            $hashPath = Join-Path $env:GITHUB_WORKSPACE "TPMate-$tag-windows-$arch.sha256"
            Remove-Item -Recurse -Force $packageDir -ErrorAction SilentlyContinue
            Remove-Item -Force $exePath, $zipPath, $hashPath -ErrorAction SilentlyContinue
            New-Item -ItemType Directory -Path $packageDir -Force | Out-Null

            Copy-Item "build/$arch/Release/TPMate.exe" $packageDir
            Copy-Item "build/$arch/Release/TPMate.exe" $exePath
            Copy-Item "README.md" $packageDir
            Compress-Archive -Path (Join-Path $packageDir "*") -DestinationPath $zipPath

            $hash = (Get-FileHash -Algorithm SHA256 $zipPath).Hash.ToLowerInvariant()
            Set-Content -Path $hashPath -NoNewline -Value "$hash  $(Split-Path -Leaf $zipPath)"
            $assets += $exePath, $zipPath, $hashPath
          }
          "RELEASE_ASSETS=$($assets -join ';')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Create or update GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $assets = $env:RELEASE_ASSETS -split ';'

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $assets --clobber
          }
          else {
            gh release create $tag $assets --verify-tag --generate-notes
          }
